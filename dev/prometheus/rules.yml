groups:
  - name: ratatoskr-dev
    rules:
      - alert: DevSampleAlert
        expr: vector(1)
        labels: { severity: info }
        annotations: { summary: "Always firing, so prom_alerts has something to show" }
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.job }} is down" }
      - record: job:up:sum
        expr: sum by (job) (up)

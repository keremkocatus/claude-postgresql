# Ratatoskr configuration.
# Secrets never go in this file: reference them as ${ENV_VAR} or ${file:/path/to/secret}.
# An undefined variable is an error. Validate with:  ratatoskr check-config --config config.yaml
# Durations accept a number of seconds or "30s", "5m", "1h", "30d".

server:
  transport: stdio            # stdio only in this release; streamable-http (remote, OAuth) arrives in the next one
  stdio_role: admins          # over stdio you act as a member of this group (see roles); unset = no access
  log_level: INFO             # DEBUG | INFO | WARNING | ERROR | CRITICAL; logs go to stderr as redacted JSON

# group -> { connection name or "*": read | write }
# Effective access = the highest grant of your groups, capped by the connection's mode. No grant = no access.
roles:
  admins: { "*": write }
  # analysts: { app-db: read }

connections:
  app-db:                     # lowercase letters, digits, '-' and '_' (max 63 characters)
    kind: postgres            # PostgreSQL 12 or newer
    description: "Application database"
    mode: read                # read (default) | write; only write connections accept pg_execute
    dsn: ${APP_DB_DSN}        # postgresql://user:password@host:5432/dbname -- use a restricted role (see README)
    statement_timeout: 30s
    pool: { min_size: 1, max_size: 5 }   # write_max_size: 2 (lazy write pool, mode: write only)
    # allowed_schemas: [public]   # filters discovery tools only; NOT a security boundary (pg_query is not limited)
    # limits: { max_rows: 500, max_response_bytes: 65536, max_query_length: 20000 }
    # tls:                        # omit to use the DSN's sslmode (asyncpg default: prefer)
    #   mode: verify-full         # disable | require | verify-ca | verify-full (default when tls is set)
    #   ca_file: /config/certs/app-db-ca.pem   # ignored by mode: require (libpq would treat that as verify-ca)
    #   cert_file: /config/certs/client.pem    # client certificate; set together with key_file
    #   key_file: /config/certs/client.key


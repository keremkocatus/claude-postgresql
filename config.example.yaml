# Ratatoskr configuration.
# Secrets never go in this file: reference them as ${ENV_VAR} or ${file:/path/to/secret}.
# An undefined variable is an error. Validate with:  ratatoskr check-config --config config.yaml
# Durations accept a number of seconds or "30s", "5m", "1h", "30d".
# Proxies: outgoing HTTP (OIDC, Prometheus) honours HTTPS_PROXY / HTTP_PROXY; list internal hosts in NO_PROXY.

server:
  transport: stdio            # stdio (local, Claude Desktop / Code) | streamable-http (remote, OAuth; see below)
  stdio_role: admins          # over stdio you act as a member of this group (see roles); unset = no access
  log_level: INFO             # DEBUG | INFO | WARNING | ERROR | CRITICAL; logs go to stderr as redacted JSON
  # ── streamable-http only (set transport: streamable-http and uncomment the auth section below) ──
  # public_url: https://mcp.example.com   # origin only, https; the MCP endpoint is <public_url>/mcp
  # host: 0.0.0.0                         # 127.0.0.1 by default; 0.0.0.0 in a container
  # port: 8000                            # keep 8000 in the container (the image's health check uses it)
  # state_path: /data/state.db            # SQLite state: clients, tokens, rate limits, audit trail
  #                                       # its directory must be writable (a bind-mounted /data: uid 10001)
  # secret_key: ${SERVER_SECRET_KEY}      # >= 32 characters, random; changing it signs everyone out
  # trusted_proxies: [172.18.0.0/16]      # address the proxy connects from, as the container sees it; XFF only from these
  # allowed_redirect_hosts: [claude.ai, claude.com, localhost, 127.0.0.1]   # OAuth client redirect hosts (exact)
  # audit_retention: 90d                  # audit rows older than this are deleted hourly (minimum 1d)

# group -> { connection name or "*": read | write }
# Effective access = the highest grant of your groups, capped by the connection's mode. No grant = no access.
roles:
  admins: { "*": write }
  # analysts: { app-db: read }

# Only for transport: streamable-http (stdio ignores it). People sign in in the browser when they add the connector.
# auth:
#   mode: local                       # local (users below) | oidc (e.g. Authentik, see docs/authentik.md)
#   access_token_ttl: 1h
#   refresh_token_ttl: 30d            # must not exceed session_max_age
#   session_max_age: 30d              # absolute sign-in lifetime; refreshing never extends it (minimum 1d)
#   local:
#     users:
#       - username: alice
#         password_hash: ${ALICE_PASSWORD_HASH}   # from `ratatoskr hash-password`; argon2id, same parameters for all
#         groups: [admins]
#   # oidc:                           # with mode: oidc instead of local
#   #   issuer: https://auth.example.com/application/o/mcp/
#   #   client_id: ${OIDC_CLIENT_ID}
#   #   client_secret: ${OIDC_CLIENT_SECRET}
#   #   scopes: [openid, email, profile, groups, offline_access]
#   #   groups_claim: groups
#   #   subject_claim: email          # or sub; see docs/authentik.md

connections:
  app-db:                     # lowercase letters, digits, '-' and '_' (max 63 characters)
    kind: postgres            # PostgreSQL 12 or newer
    description: "Application database"
    mode: read                # read (default) | write; only write connections accept pg_execute
    dsn: ${APP_DB_DSN}        # postgresql://user:password@host:5432/dbname -- use a restricted role (see README)
    statement_timeout: 30s
    pool: { min_size: 1, max_size: 5 }   # write_max_size: 2 (lazy write pool, mode: write only)
    # allowed_schemas: [public]   # filters discovery tools only; NOT a security boundary (pg_query is not limited)
    # limits: { max_rows: 500, max_response_bytes: 65536, max_query_length: 20000 }
    # tls:                        # omit to use the DSN's sslmode (asyncpg default: prefer)
    #   mode: verify-full         # disable | require | verify-ca | verify-full (default when tls is set)
    #   ca_file: /config/certs/app-db-ca.pem   # ignored by mode: require (libpq would treat that as verify-ca)
    #   cert_file: /config/certs/client.pem    # client certificate; set together with key_file
    #   key_file: /config/certs/client.key

  # metrics:                    # Prometheus HTTP API: Prometheus, Mimir, Thanos Query, VictoriaMetrics (see README)
  #   kind: prometheus          # always read-only (leave mode out); PromQL itself is not restricted
  #   description: "Production metrics"
  #   url: http://prometheus:9090   # API root (<url>/api/v1/...); for Mimir include its prefix: https://mimir/prometheus
  #   auth:                     # none (default) | basic (username, password) | bearer (token)
  #     type: bearer
  #     token: ${PROM_TOKEN}
  #   headers:                  # extra request headers, e.g. a Mimir/Cortex tenant; not Authorization or Host
  #     X-Scope-OrgID: ${PROM_TENANT}
  #   timeout: 30s              # per request; also sent to Prometheus as the query evaluation timeout
  #   tls: { verify: true }     # https only; ca_file: /config/certs/prom-ca.pem trusts only that CA
  #   limits: { max_series: 100, max_values: 500, max_points: 1000, max_range: 31d, max_response_bytes: 65536 }
  #   # limits.max_body_bytes: 8388608 (8 MiB read per request; a call holds about 10x this while decoding)

  # staging-db:
  #   kind: postgres
  #   description: "Staging database (writable)"
  #   mode: write
  #   dsn: ${STAGING_DB_DSN}              # read pool login (a read-only role)
  #   write_dsn: ${STAGING_DB_WRITE_DSN}  # optional, mode: write only: write pool login (pg_execute and
  #                                       # write-level EXPLAIN ANALYZE); recommended, see README "Security model"

[project]
name = "ratatoskr-mcp"
dynamic = ["version"]
description = "Ratatoskr: a secure, multi-connection MCP server that lets Claude query PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kerem Kocatuş" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "mcp>=1.30,<2",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/keremkocatus/claude-postgresql"
Repository = "https://github.com/keremkocatus/claude-postgresql"

[project.scripts]
ratatoskr = "ratatoskr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ratatoskr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ratatoskr"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "testcontainers>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs Docker; starts a PostgreSQL container via testcontainers"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "yaml"]
ignore_missing_imports = true

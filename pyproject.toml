[project]
name = "ratatoskr-mcp"
dynamic = ["version"]
description = "Ratatoskr: a secure, multi-connection MCP server that lets Claude query PostgreSQL, Prometheus and Loki."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kerem Kocatuş" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]
dependencies = [
    # Capped to the minor release whose internals were verified (handler, settings and client-auth behaviour the
    # OAuth layer relies on; see the "SDK facts" in the Plan 1b document). Re-verify them before raising the cap.
    "mcp>=1.30,<1.31",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.22",
    "argon2-cffi>=25.1",
    "cryptography>=45",
    "httpx>=0.28,<1",
    "joserfc>=1.8,<2",
    "python-multipart>=0.0.22",
    "starlette>=1.0,<2",
    "uvicorn>=0.35",
    # Not imported directly: uvicorn's HTTP/1.1 parser. 0.16 fixes request smuggling (CVE-2025-43859).
    "h11>=0.16",
]

[project.urls]
Homepage = "https://github.com/keremkocatus/claude-postgresql"
Repository = "https://github.com/keremkocatus/claude-postgresql"

[project.scripts]
ratatoskr = "ratatoskr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ratatoskr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ratatoskr"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "testcontainers>=4.0",
    "respx>=0.23",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs Docker; starts PostgreSQL, Prometheus and Loki containers via testcontainers"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "yaml"]
ignore_missing_imports = true

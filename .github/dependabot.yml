# Weekly update pull requests. CI must pass on each; for Python packages also refresh constraints.txt as CLAUDE.md
# ("Runtime constraints") describes, since Dependabot only edits the files it understands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The SDK cap is deliberate (pyproject.toml): raising it needs the re-verification described in CLAUDE.md.
      - dependency-name: mcp
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image runs Python 3.12 (tests/unit/test_dockerfile.py pins it): only digest updates of 3.12-slim come
      # in here. Moving to a newer Python is a deliberate change: run the suites on it, regenerate constraints.txt.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
